<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Закрытие смены — Лубянка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #18181b);
      --sec-bg: var(--tg-theme-secondary-bg-color, #27272a);
      --text: var(--tg-theme-text-color, #f4f4f5);
      --hint: var(--tg-theme-hint-color, #a1a1aa);
      --btn: var(--tg-theme-button-color, #2563eb);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 16px 16px 32px; background: var(--bg); color: var(--text); }
    .header { margin-bottom: 14px; }
    .title { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: var(--hint); margin: 0; }
    .card {
      background: var(--sec-bg); border-radius: 14px; padding: 14px;
      margin-bottom: 12px; border: 1px solid var(--border);
    }
    .label { font-size: 13px; font-weight: 600; color: var(--hint); margin-bottom: 8px; display: block; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chip {
      padding: 10px 8px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: center; line-height: 1.3;
    }
    .chip small { display: block; font-size: 11px; font-weight: 400; opacity: 0.8; }
    .chip.active { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
    .chip-full { width: 100%; margin-top: 8px; padding: 8px; font-size: 12px; }
    input[type="date"], textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; margin-top: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 15px; outline: none;
    }
    textarea { resize: vertical; min-height: 64px; margin-top: 0; }
    .submit-btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: var(--btn); color: var(--btn-text);
      font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 4px;
    }
    .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .status-box {
      display: none; margin-top: 14px; padding: 14px; border-radius: 12px;
      background: var(--sec-bg); border: 1px solid var(--border);
      text-align: center; font-size: 14px; line-height: 1.45;
    }
    .spinner {
      width: 24px; height: 24px; border: 3px solid var(--border);
      border-top-color: var(--btn); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">📊 Закрытие смены — Лубянка</h1>
    <p class="subtitle" id="userLabel">Загрузка профиля...</p>
  </div>

  <div class="card">
    <span class="label">1. Учётный день в iiko</span>
    <div class="row-2">
      <button type="button" class="chip" id="btnYesterday"></button>
      <button type="button" class="chip" id="btnToday"></button>
    </div>
    <input type="date" id="dateInput" />
  </div>

  <div class="card">
    <span class="label">2. Смена (12 часов)</span>
    <div class="row-2">
      <button type="button" class="chip" id="btnShiftNight" onclick="setShiftType('NIGHT')">
        🌙 Ночная<small>~00:00 – 12:00</small>
      </button>
      <button type="button" class="chip" id="btnShiftDay" onclick="setShiftType('DAY')">
        ☀️ Дневная<small>~12:00 – 00:00</small>
      </button>
    </div>
    <button type="button" class="chip chip-full" id="btnShiftAll" onclick="setShiftType('ALL')">
      📊 Сводка за полные сутки (обе смены)
    </button>
  </div>

  <div class="card">
    <span class="label">3. Комментарий к смене (необязательно)</span>
    <textarea id="commentInput" placeholder="Замечания по кассе или передача смены..."></textarea>
  </div>

  <button type="button" class="submit-btn" id="submitBtn" onclick="submitShiftReport()">
    ✅ Сформировать и отправить в чат
  </button>

  <div class="status-box" id="statusBox"></div>

  <script>
    // ВСТАВЬТЕ СЮДА URL ВЕБ-ПРИЛОЖЕНИЯ ИЗ ТАБЛИЦЫ ЛУБЯНКИ (ЯЧЕЙКА B36):
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwxdQY96fgs8V7dE7_cPUw2RioPZFlVgwPwSymmUIGs7rStP38hM36eZD2UFRQzoIg/exec";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    document.getElementById("userLabel").textContent = user
      ? `Закрывает: ${user.first_name}${user.username ? " (@" + user.username + ")" : ""}`
      : "HookahPlace Forever (Лубянка)";

    function toIso(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function toRu(iso) {
      const p = iso.split("-");
      return `${p[2]}/${p[1]}`;
    }

    const now = new Date();
    const hour = now.getHours();
    const todayIso = toIso(now);
    const yestIso = toIso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));

    // Умный выбор учётного дня и смены по текущему часу
    const defaultIso = hour < 7 ? yestIso : todayIso;
    const defaultShift = (hour >= 7 && hour < 18) ? "NIGHT" : "DAY";

    const btnYesterday = document.getElementById("btnYesterday");
    const btnToday = document.getElementById("btnToday");
    const dateInput = document.getElementById("dateInput");

    btnYesterday.textContent = `Вчера (${toRu(yestIso)})`;
    btnToday.textContent = `Сегодня (${toRu(todayIso)})`;

    function setSelectedDate(iso) {
      dateInput.value = iso;
      btnYesterday.classList.toggle("active", iso === yestIso);
      btnToday.classList.toggle("active", iso === todayIso);
    }

    btnYesterday.onclick = () => setSelectedDate(yestIso);
    btnToday.onclick = () => setSelectedDate(todayIso);
    dateInput.onchange = () => setSelectedDate(dateInput.value);
    setSelectedDate(defaultIso);

    let currentShiftType = defaultShift;
    function setShiftType(type) {
      currentShiftType = type;
      document.getElementById("btnShiftNight").classList.toggle("active", type === "NIGHT");
      document.getElementById("btnShiftDay").classList.toggle("active", type === "DAY");
      document.getElementById("btnShiftAll").classList.toggle("active", type === "ALL");
    }
    setShiftType(defaultShift);

    async function submitShiftReport() {
      const submitBtn = document.getElementById("submitBtn");
      const statusBox = document.getElementById("statusBox");

      submitBtn.disabled = true;
      statusBox.style.display = "block";
      statusBox.innerHTML = `<div class="spinner"></div><b>Отчёт формируется, ожидайте...</b><br>Выгружаю выбранную смену из iiko (10–15 сек).`;

      try {
        const payload = {
          action: "publish_shift",
          initData: tg.initData || "",
          dateIso: dateInput.value,
          shiftType: currentShiftType,
          comment: document.getElementById("commentInput").value.trim(),
          photos: []
        };

        const res = await fetch(GAS_WEBAPP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status === "OK") {
          statusBox.innerHTML = `✅ <b>Отчёт успешно отправлен в рабочий чат!</b>`;
          setTimeout(() => tg.close(), 1200);
          return;
        }
        throw new Error(data.message || "Неизвестный ответ сервера");
      } catch (err) {
        statusBox.innerHTML = `❌ <b>Ошибка:</b> ${err.message}`;
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
